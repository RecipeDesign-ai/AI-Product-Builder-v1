<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>저녁 메뉴 추천 · 다크/화이트</title>

  <style>
    /* =========================
       THEME TOKENS
       ========================= */
    :root{
      --bg: #0b1220;
      --bg2: rgba(0,0,0,.26);
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.03);
      --border: rgba(255,255,255,.12);
      --border2: rgba(255,255,255,.10);
      --text: #eaf0ff;
      --muted:#a9b6d6;
      --shadow: 0 18px 40px rgba(0,0,0,.35);

      --btnText:#071023;
      --btnGrad1:#7dd3ff;
      --btnGrad2:#3b82f6;
      --btnShadow: 0 10px 18px rgba(59,130,246,.35);

      --hint: rgba(169,182,214,.95);
    }

    /* Light theme overrides */
    [data-theme="light"]{
      --bg: #f6f8ff;
      --bg2: rgba(15, 23, 42, .06);
      --card: rgba(255,255,255,.78);
      --card2: rgba(255,255,255,.56);
      --border: rgba(15,23,42,.10);
      --border2: rgba(15,23,42,.10);
      --text: #0b1220;
      --muted:#46556f;
      --shadow: 0 18px 40px rgba(2,6,23,.10);

      --btnText:#071023;
      --btnGrad1:#93c5fd;
      --btnGrad2:#60a5fa;
      --btnShadow: 0 10px 18px rgba(96,165,250,.25);

      --hint: rgba(70,85,111,.95);
    }

    /* =========================
       BASE
       ========================= */
    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(86,155,255,.18), transparent 55%),
        radial-gradient(900px 500px at 20% 10%, rgba(168,92,255,.14), transparent 60%),
        radial-gradient(900px 500px at 80% 20%, rgba(0,255,187,.10), transparent 55%),
        var(--bg);
    }

    .wrap{
      width:min(1040px, 100%);
      display:grid;
      gap:14px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      padding:0 4px;
      flex-wrap:wrap;
    }
    h1{ margin:0; font-size:clamp(22px, 3vw, 30px); letter-spacing:-0.02em; }
    .sub{ margin:0; color:var(--muted); font-size:14px; }

    .header-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .card{
      border:1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card2));
      border-radius:18px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .top{
      padding:16px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }
    .meta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      color:var(--muted);
      font-size:13px;
    }
    .pill{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--border2);
      background: rgba(255,255,255,.06);
      white-space:nowrap;
    }
    [data-theme="light"] .pill{
      background: rgba(2,6,23,.04);
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:12px 16px;
      font-weight:800;
      color:var(--btnText);
      background: linear-gradient(180deg, var(--btnGrad1), var(--btnGrad2));
      box-shadow: var(--btnShadow);
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ transform: translateY(-1px); filter:saturate(1.1); }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn[disabled]{ opacity:.55; cursor:not-allowed; transform:none; }

    /* Theme toggle button - subtle */
    .btn-ghost{
      appearance:none;
      border:1px solid var(--border2);
      cursor:pointer;
      border-radius:14px;
      padding:10px 12px;
      font-weight:800;
      color:var(--text);
      background: rgba(255,255,255,.05);
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-ghost:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); }
    .btn-ghost:active{ transform: translateY(1px) scale(.99); }
    [data-theme="light"] .btn-ghost{
      background: rgba(2,6,23,.03);
    }
    [data-theme="light"] .btn-ghost:hover{
      background: rgba(2,6,23,.06);
    }

    .stage{
      padding:16px;
      border-top:1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(0,0,0,.06), var(--bg2));
      display:grid;
      gap:12px;
    }
    [data-theme="light"] .stage{
      border-top:1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(2,6,23,.02), rgba(2,6,23,.04));
    }

    .game{
      border:1px solid var(--border2);
      background: rgba(255,255,255,.03);
      border-radius:16px;
      overflow:hidden;
    }
    [data-theme="light"] .game{
      background: rgba(2,6,23,.02);
    }

    .game-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-weight:800;
      letter-spacing:-0.01em;
      gap:10px;
      flex-wrap:wrap;
    }
    [data-theme="light"] .game-head{
      border-bottom:1px solid rgba(15,23,42,.08);
    }
    .game-head small{
      font-weight:700;
      color:var(--muted);
    }

    /* =========================
       MENU DISPLAY
       ========================= */
    .menu-item{
      border:1px solid var(--border2);
      background: rgba(255,255,255,.03);
      border-radius:16px;
      padding:16px;
      font-size:20px;
      font-weight:700;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:80px;
      transition: all .2s ease;
      cursor:pointer;
    }
    .menu-item:hover{
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    [data-theme="light"] .menu-item{
      background: rgba(2,6,23,.02);
    }

    /* =========================
       RESPONSIVE
       ========================= */
    @media (max-width: 980px){
      body{ padding:18px; }
      .wrap{ width:min(920px, 100%); }
      .ball{ width:70px; height:70px; }
      .ball .inner{ width:44px; height:44px; }
    }

    /* tablet */
    @media (max-width: 860px){
      .grid{
        grid-template-columns: repeat(4, minmax(0,1fr));
      }
      .bonus-slot::before{ display:none; }
      .ball{ width:66px; height:66px; }
      .ball .inner{ width:42px; height:42px; }
      .game-head{ align-items:flex-start; }
    }

    /* mobile */
    @media (max-width: 360px){
      body{ padding:14px; }
      .top{ padding:14px; }
      .stage{ padding:30px; }
      .grid{
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap:10px;
      }
      .ball{ width:45px; height:45px; }
      .ball .inner{ width:30px; height:30px; }
      .ball .num{ font-size:12px; }
      .btn{ width:100%; justify-content:center; }
      .btn-ghost{ width:100%; justify-content:center; }
      .header-actions{ width:100%; justify-content:flex-start; }
      .pill{ font-size:12px; }
    }

    /* Accessibility: reduce motion */
    @media (prefers-reduced-motion: reduce){
      .ball.show{ animation: none !important; opacity:1 !important; transform:none !important; }
      .btn, .btn-ghost{ transition:none; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>저녁 메뉴 추천</h1>
        <p class="sub">오늘 저녁 뭐 먹을지 고민될 때! · 다크/화이트 전환 · 반응형</p>
      </div>

      <div class="header-actions">
        <button class="btn-ghost" id="themeBtn" type="button" aria-label="테마 전환">
          <span id="themeIcon">🌙</span>
          <span id="themeText">다크</span>
        </button>

      </div>
    </header>

    <section class="card">
      <div class="top">
        <div class="meta">
          <div class="pill" id="last">마지막 추천 시간: -</div>

        </div>
        <button class="btn" id="pickBtn" type="button">메뉴 추천받기</button>
      </div>

      <div class="stage">

        <div id="games"></div>
      </div>
    </section>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      alert('스크립트 오류: ' + (e.message || e.error));
    });

    const pickBtn = document.getElementById('pickBtn');
    const last = document.getElementById('last');
    const gamesWrap = document.getElementById('games'); // Renaming to menuWrap mentally

    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function pad2(n){ return String(n).padStart(2,'0'); }
    function nowStamp(){
      const d = new Date();
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }

    /* =========================
       THEME: persist in localStorage
       ========================= */
    const THEME_KEY = 'dinner_theme';

    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      if(theme === 'light'){
        themeIcon.textContent = '☀️';
        themeText.textContent = '화이트';
      }else{
        themeIcon.textContent = '🌙';
        themeText.textContent = '다크';
      }
    }

    function getPreferredTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      return prefersLight ? 'light' : 'dark';
    }

    let currentTheme = getPreferredTheme();
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
      currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, currentTheme);
      applyTheme(currentTheme);
    });

    /* =========================
       DINNER MENU LOGIC
       ========================= */
    const dinnerMenus = [
      "김치찌개", "된장찌개", "불고기", "제육볶음", "닭볶음탕",
      "삼겹살", "갈비찜", "순두부찌개", "부대찌개", "비빔밥",
      "김치볶음밥", "오므라이스", "돈까스", "초밥", "파스타",
      "피자", "족발", "보쌈", "막국수", "칼국수",
      "냉면", "회", "떡볶이", "치킨", "찜닭",
      "아구찜", "해물찜", "곱창", "대창", "닭갈비",
      "삼계탕", "추어탕", "감자탕", "백반", "샐러드"
    ];

    function pickDinnerMenu(){
      const randomIndex = Math.floor(Math.random() * dinnerMenus.length);
      return dinnerMenus[randomIndex];
    }

    function renderMenu(menu){
      gamesWrap.innerHTML = ''; // Clear previous recommendations
      
      const menuItemEl = document.createElement('div');
      menuItemEl.className = 'menu-item';
      menuItemEl.textContent = menu;
      
      gamesWrap.appendChild(menuItemEl);
    }

    async function recommendDinnerMenu(){
      pickBtn.disabled = true;

      const recommendedMenu = pickDinnerMenu();
      renderMenu(recommendedMenu);

      last.textContent = `마지막 추천 시간: ${nowStamp()}`;
      
      // Simulate some loading time
      await new Promise(r => setTimeout(r, 500)); 

      pickBtn.disabled = false;
    }

    pickBtn.addEventListener('click', recommendDinnerMenu);

    // Initial load: show a random menu
    recommendDinnerMenu();
  </script>
</body>
</html>
